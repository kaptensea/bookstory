[package]
name = "bookstory"
version = "0.1.0"
description = "Audiobookshelf desktop client"
authors = ["Swetux"]
edition = "2021"

[lib]
# The `_lib` suffix is required to avoid name conflicts on Windows.
name = "audiobookshelf_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
rand = "0.8"

# OS keyring support (Linux Secret Service / macOS Keychain / Windows Credential Manager)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
