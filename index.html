<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstory</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>

    <div class="container">

      <!-- LOGIN VIEW -->
      <div id="loginView">
        <div class="login-brand">
          <img src="/src/assets/bookstory-logo.svg" alt="Bookstory" class="login-logo" />
          <h1>Bookstory</h1>
        </div>
        <p id="loginSubtitle" class="subtitle">Connect to your Audiobookshelf server</p>

        <label id="serverLabel" for="server">Server address</label>
        <input id="server" type="text" />

        <label id="usernameLabel" for="username">Username</label>
        <input id="username" type="text" />

        <label id="passwordLabel" for="password">Password</label>
        <input id="password" type="password" />

        <button id="loginBtn">Sign in</button>
        <div id="loginMsg" class="msg"></div>
      </div>

    </div>

    <!-- HOME VIEW -->
    <div id="homeView" style="display:none;">


      <!-- TOP BAR (full width) -->
      <div class="topbar" data-tauri-drag-region>
        <h1 id="topbarTitle">Bookstory</h1>
        <div id="topbarBrand" aria-hidden="true">
          <img src="/src/assets/bookstory-logo.svg" alt="" />
        </div>
        <div class="topbar-right">
          <div id="windowControls">
            <button id="winMinBtn" type="button" title="Minimize">_</button>
            <button id="winMaxBtn" type="button" title="Maximize">▢</button>
            <button id="winCloseBtn" type="button" title="Close">✕</button>
          </div>
        </div>
      </div>

      <!-- CONTENT ROW -->
      <!-- (outer duplicate removed, only one sidebar/mainContent remains) -->

      <!-- CONTENT ROW -->
      <!-- (outer duplicate removed, only one sidebar/mainContent remains) -->

      <!-- CONTENT ROW -->
      <div class="contentRow">
        <!-- SIDEBAR -->
        <aside id="sidebar">
          <h3 id="sidebarLibraryLabel">Library</h3>
          <select id="librarySelect" size="8"></select>
          <h3 id="sidebarSortLabel">Sort</h3>
          <select id="sortSelect">
            <option value="recent">Recently added</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
          <button id="settingsBtn" style="margin-top:12px;">Settings</button>
          <button id="logoutBtn" style="margin-top:12px;">Log out</button>
          <div id="whoami" class="sidebar-whoami"></div>
        </aside>
        <!-- MAIN CONTENT -->
        <main id="mainContent">
          <!-- SEARCH BAR (in main content, right aligned) -->
          <div id="searchBarWrap" class="search-bar-wrap" style="width:100%; display:flex; justify-content:flex-end; align-items:flex-start; position:relative; margin-bottom:18px;">
            <div style="min-width:260px; max-width:340px; width:100%; margin:0 18px 0 0; position:relative;">
              <input id="searchInput" class="search-input" type="text" autocomplete="off" />
            </div>
          </div>
          <div id="updateBanner" class="update-banner" style="display:none;">
            <div class="update-banner-copy">
              <div id="updateBannerTitle" class="update-banner-title"></div>
              <div id="updateBannerHint" class="update-banner-hint"></div>
            </div>
            <div class="update-banner-actions">
              <button id="updateBannerOpenBtn" type="button">Open release</button>
              <button id="updateBannerDismissBtn" type="button" aria-label="Dismiss update notice">Dismiss</button>
            </div>
          </div>
          <section id="continueSection">
            <h2 id="continueHeading">Continue Listening</h2>
            <div id="continueList" class="list"></div>
            <div id="continueEmpty" class="hint" style="display:none;">
              Nothing in progress yet.
            </div>
          </section>

          <div id="libraryTotal" class="library-total"></div>
          <div id="libraryItemsView"></div>
          <div id="itemDetailView" style="display:none;"></div>
          <div id="settingsView" style="display:none;"></div>
          <div id="homeMsg" class="msg"></div>
        </main>

      </div>
    </div>

    <audio id="player" preload="metadata"></audio>
    <div id="miniPlayer" class="mini-root" style="display:none">

  <img id="miniCover">

  <div id="miniInfo" class="mini-click">

    <div id="miniTitleRow">
      <div id="miniTitle">Nothing playing</div>
      <div id="miniLoading" class="mini-loading"></div>
    </div>
    <div id="miniAuthor"></div>

    <div id="miniProgressWrap">
      <input id="miniSeek" type="range" min="0" max="100" value="0" />
    </div>

    <div id="miniTimeRow">
      <span id="miniCurrent">0:00</span>
      <span id="miniTotal">0:00</span>
    </div>

    <div id="miniControls">

  <div id="miniButtons">
      <button id="miniPrevChapter">❮</button>
      <button id="miniPlayPause">▶</button>
      <button id="miniNextChapter">❯</button>
      <button id="openNowPlaying">▲</button>
  </div>

  <div id="miniVolumeWrap">
      <input id="miniVolume" type="range" min="0" max="1" step="0.01" value="1">
  </div>

</div>


  </div>

</div>


<div id="nowPlayingView" class="now-playing" style="display:none">

  <div id="npBg"></div>

  <button id="closeNowPlaying" aria-label="Minimize now playing">↓</button>

  <img id="npCover" />

  <div id="npTitleRow">
    <div id="npTitle"></div>
    <div id="npLoading" class="mini-loading np-loading"></div>
  </div>
  <div id="npAuthor"></div>
  <div id="npLoadingText" class="np-loading-text" style="display:none;">Buffering...</div>

  <input id="npSeek" type="range" min="0" max="100" value="0" />

  <div id="npTimeRow">
    <span id="npCurrent">0:00</span>
    <span id="npTotal">0:00</span>
  </div>

  <div class="np-controls">
  <button id="npBack">❮</button>
  <button id="npPlayPause">▶</button>
  <button id="npForward">❯</button>
  <button id="npNextChapter">⏭</button>
</div>

</div>
  </body>
</html>
